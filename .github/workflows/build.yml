name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Prepare Flutter Project
        run: |
          # پشتیبان‌گیری از main.dart شما
          cp lib/main.dart ./temp_main.dart
          # پاکسازی و ساخت اسکلت پروژه
          rm -rf * .git*
          flutter create --org com.serviceyar --project-name serviceyar .
          # بازگرداندن فایل‌های شما
          mkdir -p lib
          mv ./temp_main.dart lib/main.dart
          # تنظیم نام فارسی برنامه در اندروید
          sed -i 's/android:label="serviceyar"/android:label="سرویس‌یار"/g' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ServiceYar-App
          path: build/app/outputs/flutter-apk/app-release.apk
