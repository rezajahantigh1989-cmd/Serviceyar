name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create Flutter Project Structure
        run: |
          flutter create --org com.serviceyar --project-name serviceyar app_temp
          cp -r app_temp/* .
          cp -r app_temp/.* . 2>/dev/null || true
          rm -rf app_temp
          mkdir -p lib
          if [ -f main.dart ]; then
            cp main.dart lib/main.dart
          fi
